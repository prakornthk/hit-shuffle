name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate dataset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/validate.mjs

  deploy:
    name: Deploy to GitHub Pages
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4

  screenshots:
    name: Screenshot desktop + mobile
    needs: validate
    # Evidence job: uploads renders for review; not required to merge.
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i -D playwright@latest && npx playwright install chromium --with-deps
      - run: |
          npx playwright screenshot \
            --viewport-size=1440,900 --wait-for-timeout=1500 \
            --browser=chromium "file://$PWD/index.html" shot-desktop.png
          npx playwright screenshot \
            --viewport-size=390,844 --wait-for-timeout=1500 --full-page \
            --browser=chromium "file://$PWD/index.html" shot-mobile.png
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shot-*.png
          retention-days: 14
